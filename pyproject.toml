[project]
name = "comfyui-kirei-minimax-h3-icr"
version = "0.1.0"
description = "Kirei research-grade in-context regeneration nodes for MiniMax H3 in ComfyUI"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["h3_icr"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"h3_icr/attention_profile.py" = ["E731"]
